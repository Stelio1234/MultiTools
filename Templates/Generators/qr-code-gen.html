<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>

<meta name="theme-color" content="#121212">

<link rel="stylesheet" href="/vendor/fontawesome-6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous">

<meta name="description" content="Create and download custom QR codes for text, websites, Wi-Fi, phone numbers, and email addresses.">
<link rel="canonical" href="https://www.themultitools.xyz/Templates/Generators/qr-code-gen.html">

<body class="workspace-page split-workspace qr-page">

<main class="main-container">
  <div class="qr-heading">
  </div>
  <div class="container">
    <div class="controls">
      <h1 class="title">QR Code Generator</h1>

      <div class="settings-group full-span">
        <label for="Qr-Type">QR Code Type</label>
        <select id="Qr-Type">
          <option value="text">URL or PlainText</option>
          <option value="wifi">Wifi Network</option>
          <option value="phone">Phone Number</option>
          <option value="email">Email Address</option>
        </select>
      </div>

      <div id="text-group" class="settings-group full-span">
        <label for="content">Content</label>
        <input type="text" id="content" placeholder="Enter URL or Text">
      </div>

      <div id="wifi-group" class="settings-group full-span" style="display: none;">
        <label for="wifi-ssid">SSID</label>
        <input type="text" id="wifi-ssid" placeholder="WiFi Name">
        <label for="wifi-pass">Password</label>
        <input type="password" id="wifi-pass" placeholder="Password">
        <label for="wifi-type">Encryption</label>
        <select id="wifi-type">
          <option value="WPA">WPA/WPA2</option>
          <option value="WEP">WEP</option>
          <option value="nopass">None</option>
        </select>
      </div>

      <div id="phone-group" class="settings-group full-span" style="display: none;">
        <label for="phone-num">Phone Number</label>
        <input type="tel" id="phone-num" placeholder="+1234567890">
      </div>

      <div id="email-group" class="settings-group full-span" style="display: none;">
        <label for="email-addr">Email Address</label>
        <input type="email" id="email-addr" placeholder="example@mail.com">
      </div>

      <h2 class="qr-section-title qr-section-divider full-span">Export settings</h2>
      <div class="settings-group">
        <label for="qrcode-name">File Name</label>
        <input type="text" id="qrcode-name" placeholder="My QR Code">
      </div>

      <div class="settings-group">
        <label for="size-preset">Size Preset</label>
        <select id="size-preset">
          <option value="300">Standard (300px)</option>
          <option value="150">Small (150px)</option>
          <option value="600">Large (600px)</option>
          <option value="1000">Print Quality (1000px)</option>
          <option value="custom">Manual Custom...</option>
        </select>
      </div>

      <div id="manual-size-group" class="settings-group full-span" style="display:none;">
        <label for="qr-size">Manual Width/Height (px)</label>
        <input type="number" id="qr-size" value="300" min="50" max="2000">
      </div>

      <h2 class="qr-section-title qr-section-divider full-span">Appearance</h2>
      <div class="settings-group">
        <label for="shape">Dot Shape</label>
        <select id="shape">
          <option value="square">Square</option>
          <option value="dots">Dots</option>
          <option value="rounded">Rounded</option>
          <option value="extra-rounded">Extra Rounded</option>
          <option value="classy">Classy</option>
        </select>
      </div>

      <div class="settings-group">
        <label for="gradient-type">Gradient Type</label>
        <select id="gradient-type">
          <option value="linear">Linear</option>
          <option value="radial">Radial</option>
        </select>
      </div>

      <div class="settings-group">
        <label for="gradient-from">Color From</label>
        <input type="color" id="gradient-from" class="color-input" value="#000000">
      </div>

      <div class="settings-group">
        <label for="gradient-to">Color To</label>
        <input type="color" id="gradient-to" class="color-input" value="#45a049">
      </div>

      <div class="settings-group">
        <label for="bg-color">Background</label>
        <input type="color" id="bg-color" class="color-input" value="#ffffff">
      </div>

      <div class="settings-group qr-checkbox-field">
        <label for="transparent-bg">Transparent</label>
        <input type="checkbox" id="transparent-bg">
      </div>

      <div class="settings-group full-span">
        <label for="logo">Logo Overlay</label>
        <input type="file" id="logo" accept="image/*">
      </div>

      <div class="button-group">
        <button class="btn-secondary" id="gradient-toggle-btn" type="button">Use Gradient: On</button>

        <button class="btn-secondary" id="reset" data-secondary-action="true" type="button">Reset All</button>

      </div>

    </div>

    <section class="preview" aria-labelledby="qr-preview-title">
      <h2 id="qr-preview-title">Preview</h2>
      <div class="qr-preview-stage"><div id="qr-code"></div></div>
      <button class="btn-primary" id="download" type="button">Download PNG</button>
    </section>
  </div>
</main>

<script src="/vendor/jquery-3.7.1.min.js"></script>
<script src="/js/pages/templates-generators-qr-code-gen-1.js"></script>
