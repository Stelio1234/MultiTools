<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR Code Generator</title>
<link rel="icon" type="image/x-icon" href="/images/MultiTools.jpg" />
<meta name="theme-color" content="#121212" />
<link rel="manifest" href="/manifest.json" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>


  <link rel="stylesheet" href="../../css/index.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <link rel="stylesheet" href="../../css/footer.css" />
</head>
<body class="workspace-page split-workspace qr-page">

<main class="main-container">
  <div class="qr-heading">
  </div>
  <div class="container">
    <div class="controls">
      <h1 class="title">QR Code Generator</h1>

      <div class="settings-group full-span">
        <label for="Qr-Type">QR Code Type</label>
        <select id="Qr-Type">
          <option value="text">URL or PlainText</option>
          <option value="wifi">Wifi Network</option>
          <option value="phone">Phone Number</option>
          <option value="email">Email Address</option>
        </select>
      </div>

      <div id="text-group" class="settings-group full-span">
        <label for="content">Content</label>
        <input type="text" id="content" placeholder="Enter URL or Text">
      </div>

      <div id="wifi-group" class="settings-group full-span" style="display: none;">
        <label for="wifi-ssid">SSID</label>
        <input type="text" id="wifi-ssid" placeholder="WiFi Name">
        <label for="wifi-pass">Password</label>
        <input type="password" id="wifi-pass" placeholder="Password">
        <label for="wifi-type">Encryption</label>
        <select id="wifi-type">
          <option value="WPA">WPA/WPA2</option>
          <option value="WEP">WEP</option>
          <option value="nopass">None</option>
        </select>
      </div>

      <div id="phone-group" class="settings-group full-span" style="display: none;">
        <label for="phone-num">Phone Number</label>
        <input type="tel" id="phone-num" placeholder="+1234567890">
      </div>

      <div id="email-group" class="settings-group full-span" style="display: none;">
        <label for="email-addr">Email Address</label>
        <input type="email" id="email-addr" placeholder="example@mail.com">
      </div>

      <h2 class="qr-section-title qr-section-divider full-span">Export settings</h2>
      <div class="settings-group">
        <label for="qrcode-name">File Name</label>
        <input type="text" id="qrcode-name" placeholder="My QR Code">
      </div>

      <div class="settings-group">
        <label for="size-preset">Size Preset</label>
        <select id="size-preset">
          <option value="300">Standard (300px)</option>
          <option value="150">Small (150px)</option>
          <option value="600">Large (600px)</option>
          <option value="1000">Print Quality (1000px)</option>
          <option value="custom">Manual Custom...</option>
        </select>
      </div>

      <div id="manual-size-group" class="settings-group full-span" style="display:none;">
        <label for="qr-size">Manual Width/Height (px)</label>
        <input type="number" id="qr-size" value="300" min="50" max="2000">
      </div>

      <h2 class="qr-section-title qr-section-divider full-span">Appearance</h2>
      <div class="settings-group">
        <label for="shape">Dot Shape</label>
        <select id="shape">
          <option value="square">Square</option>
          <option value="dots">Dots</option>
          <option value="rounded">Rounded</option>
          <option value="extra-rounded">Extra Rounded</option>
          <option value="classy">Classy</option>
        </select>
      </div>

      <div class="settings-group">
        <label for="gradient-type">Gradient Type</label>
        <select id="gradient-type">
          <option value="linear">Linear</option>
          <option value="radial">Radial</option>
        </select>
      </div>

      <div class="settings-group">
        <label for="gradient-from">Color From</label>
        <input type="color" id="gradient-from" class="color-input" value="#000000">
      </div>

      <div class="settings-group">
        <label for="gradient-to">Color To</label>
        <input type="color" id="gradient-to" class="color-input" value="#45a049">
      </div>

      <div class="settings-group">
        <label for="bg-color">Background</label>
        <input type="color" id="bg-color" class="color-input" value="#ffffff">
      </div>

      <div class="settings-group qr-checkbox-field">
        <label for="transparent-bg">Transparent</label>
        <input type="checkbox" id="transparent-bg">
      </div>

      <div class="settings-group full-span">
        <label for="logo">Logo Overlay</label>
        <input type="file" id="logo" accept="image/*">
      </div>

      <div class="button-group">
        <button class="btn-secondary" id="gradient-toggle-btn">Use Gradient: On</button>

        <button class="btn-secondary" id="reset" data-secondary-action="true">Reset All</button>

      </div>

    </div>

    <section class="preview" aria-labelledby="qr-preview-title">
      <h2 id="qr-preview-title">Preview</h2>
      <div class="qr-preview-stage"><div id="qr-code"></div></div>
      <button class="btn-primary" id="download" type="button">Download PNG</button>
    </section>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
    let useGradient = true;
    let logoData = "";

    // Initialize the QR Code instance
    const qrCode = new QRCodeStyling({
        width: 300,
        height: 300,
        type: "canvas",
        data: "Hello World",
        dotsOptions: {
            color: "#000000",
            type: "square"
        },
        backgroundOptions: {
            color: "#ffffff"
        },
    });

    qrCode.append(document.getElementById("qr-code"));

    function updateQRCode() {
        const type = $('#Qr-Type').val();
        let finalData = "";

        // Visibility Logic
        $('#text-group, #wifi-group, #phone-group, #email-group').hide();
        if (type === 'wifi') {
            $('#wifi-group').show();
            finalData = `WIFI:S:${$('#wifi-ssid').val()};T:${$('#wifi-type').val()};P:${$('#wifi-pass').val()};;`;
        } else if (type === 'phone') {
            $('#phone-group').show();
            finalData = `tel:${$('#phone-num').val()}`;
        } else if (type === 'email') {
            $('#email-group').show();
            finalData = `mailto:${$('#email-addr').val()}`;
        } else {
            $('#text-group').show();
            finalData = $('#content').val() || "Hello World";
        }

        // Sizing Logic
        const preset = $('#size-preset').val();
        let size = 300;
        if (preset === 'custom') {
            $('#manual-size-group').show();
            size = parseInt($('#qr-size').val()) || 300;
        } else {
            $('#manual-size-group').hide();
            size = parseInt(preset);
        }

        let dotsOptions = {
            type: $('#shape').val()
        };

        if (useGradient) {

            dotsOptions.gradient = {
                type: $('#gradient-type').val(),
                rotation: 0,
                colorStops: [
                    { offset: 0, color: $('#gradient-from').val() },
                    { offset: 1, color: $('#gradient-to').val() }
                ]
            };
            delete dotsOptions.color; 
        } else {
            dotsOptions.color = $('#gradient-from').val();
            dotsOptions.gradient = null; 
}

        // Apply Updates
        qrCode.update({
            width: size,
            height: size,
            data: finalData,
            dotsOptions: dotsOptions,
            backgroundOptions: {
                color: $('#transparent-bg').is(":checked") ? "transparent" : $('#bg-color').val()
            },
            image: logoData || null,
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 5
            }
        });
    }

    $(document).ready(function () {
        // Universal listener for inputs
        $('input, select').on('input change', updateQRCode);

        // Fixed Gradient Toggle: Moved outside of updateQRCode to prevent recursion
        $('#gradient-toggle-btn').on('click', function () {
            useGradient = !useGradient;
            $(this).text(`Use Gradient: ${useGradient ? "On" : "Off"}`);
            updateQRCode();
        });

        // Logo Upload Logic
        $('#logo').change(function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    logoData = e.target.result;
                    updateQRCode();
                };
                reader.readAsDataURL(file);
            }
        });

        // Download Logic
        $('#download').click(function () {
            qrCode.download({
                name: $('#qrcode-name').val() || "qr-code",
                extension: "png"
            });
        });

        // Reset Logic
        $('#reset').click(function () {
            location.reload();
        });

        // Initial Run
        updateQRCode();
    });
</script>
</script>
<button class="back-button" type="button" onclick="window.history.back()">&#8592; Back</button>
</body>
</html>
