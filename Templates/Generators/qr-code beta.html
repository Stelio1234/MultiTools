<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://multitools.statuspage.io https://naas.isalman.dev; frame-src https://multitools-48cc8.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced QR Code Editor</title>

<meta name="theme-color" content="#121212">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/vendor/fontawesome-6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous">
<script src="/vendor/qr-code-styling-1.9.2.js"></script>

  <link rel="stylesheet" href="../../css/index.css">
  <link rel="stylesheet" href="../../css/pages.css">
  <link rel="stylesheet" href="../../css/qr-editor.css">
  <link rel="stylesheet" href="../../css/footer.css">

<meta name="description" content="Try the advanced MultiTools QR editor with gradients, logos, vCards, calendar events, and export options.">
<link rel="canonical" href="https://www.themultitools.xyz/Templates/Generators/qr-code%20beta.html">
<link rel="icon" href="/images/MultiTools.jpg" type="image/jpeg">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/consent.css"><script src="/js/site-consent.js"></script></head>
<body class="workspace-page qr-editor">

<div class="main-container">
  <div class="header-row">

    <div class="header">
      <i class="fas fa-qrcode"></i> QR Code Generator
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">

      <div class="panel open" id="panel-type">
        <button type="button" class="panel-header" aria-expanded="true" aria-controls="panel-type-body" data-action="action-1">
          <span class="panel-header-left"><span class="panel-icon"><i class="fas fa-tag"></i></span> QR Type</span>
          <i class="fas fa-chevron-down chevron"></i>
        </button>
        <div class="panel-body" id="panel-type-body">
          <div class="field">
            <label for="qr-type">Content Type</label>
            <select id="qr-type">
              <option value="text">URL / Plain Text</option>
              <option value="wifi">WiFi Network</option>
              <option value="phone">Phone Number</option>
              <option value="email">Email Address</option>
              <option value="sms">SMS Message</option>
              <option value="vcard">vCard (Contact Card)</option>
              <option value="geo">Geographic Location</option>
              <option value="event">Calendar Event</option>
            </select>
          </div>
          <div id="g-text">
            <div class="field"><label for="content">URL or Text</label><input type="text" id="content" placeholder="https://example.com"></div>
          </div>
          <div id="g-wifi" style="display:none">
            <div class="field"><label for="wifi-ssid">Network Name (SSID)</label><input type="text" id="wifi-ssid" placeholder="WiFi Name"></div>
            <div class="field"><label for="wifi-pass">Password</label><input type="password" id="wifi-pass" placeholder="Password"></div>
            <div class="field"><label for="wifi-type">Security</label>
              <select id="wifi-type"><option value="WPA">WPA / WPA2</option><option value="WEP">WEP</option><option value="nopass">None / Open</option></select>
            </div>
            <div class="toggle-row"><label>Hidden Network</label><label class="toggle"><input type="checkbox" id="wifi-hidden" aria-label="Hidden network"><span class="toggle-slider"></span></label></div>
          </div>
          <div id="g-phone" style="display:none">
            <div class="field"><label for="phone-num">Phone Number</label><input type="tel" id="phone-num" placeholder="+1 555 000 0000"></div>
          </div>
          <div id="g-email" style="display:none">
            <div class="field"><label for="email-addr">Email Address</label><input type="email" id="email-addr" placeholder="hello@example.com"></div>
            <div class="field"><label for="email-subject">Subject (optional)</label><input type="text" id="email-subject" placeholder="Subject line"></div>
            <div class="field"><label for="email-body">Body (optional)</label><textarea id="email-body" placeholder="Pre-filled message..."></textarea></div>
          </div>
          <div id="g-sms" style="display:none">
            <div class="field"><label for="sms-num">Phone Number</label><input type="tel" id="sms-num" placeholder="+1 555 000 0000"></div>
            <div class="field"><label for="sms-body">Message (optional)</label><textarea id="sms-body" placeholder="Pre-filled message..."></textarea></div>
          </div>
          <div id="g-vcard" style="display:none">
            <div class="field-row">
              <div class="field"><label for="vc-first">First Name</label><input type="text" id="vc-first" placeholder="John"></div>
              <div class="field"><label for="vc-last">Last Name</label><input type="text" id="vc-last" placeholder="Doe"></div>
            </div>
            <div class="field"><label for="vc-org">Organization</label><input type="text" id="vc-org" placeholder="Acme Corp"></div>
            <div class="field"><label for="vc-title">Job Title</label><input type="text" id="vc-title" placeholder="CEO"></div>
            <div class="field"><label for="vc-phone">Work Phone</label><input type="tel" id="vc-phone" placeholder="+1 555 000 0000"></div>
            <div class="field"><label for="vc-mobile">Mobile</label><input type="tel" id="vc-mobile" placeholder="+1 555 000 0001"></div>
            <div class="field"><label for="vc-email">Email</label><input type="email" id="vc-email" placeholder="john@example.com"></div>
            <div class="field"><label for="vc-web">Website</label><input type="url" id="vc-web" placeholder="https://johndoe.com"></div>
            <div class="field"><label for="vc-street">Street Address</label><input type="text" id="vc-street" placeholder="123 Main St"></div>
            <div class="field-row">
              <div class="field"><label for="vc-city">City</label><input type="text" id="vc-city" placeholder="New York"></div>
              <div class="field"><label for="vc-state">State</label><input type="text" id="vc-state" placeholder="NY"></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="vc-zip">ZIP</label><input type="text" id="vc-zip" placeholder="10001"></div>
              <div class="field"><label for="vc-country">Country</label><input type="text" id="vc-country" placeholder="US"></div>
            </div>
            <div class="field"><label for="vc-note">Note</label><textarea id="vc-note" placeholder="Additional info..."></textarea></div>
          </div>
          <div id="g-geo" style="display:none">
            <div class="field-row">
              <div class="field"><label for="geo-lat">Latitude</label><input type="number" id="geo-lat" step="0.000001" placeholder="40.7128"></div>
              <div class="field"><label for="geo-lng">Longitude</label><input type="number" id="geo-lng" step="0.000001" placeholder="-74.0060"></div>
            </div>
          </div>
          <div id="g-event" style="display:none">
            <div class="field"><label for="ev-title">Event Title</label><input type="text" id="ev-title" placeholder="Team Meeting"></div>
            <div class="field"><label for="ev-loc">Location</label><input type="text" id="ev-loc" placeholder="Conference Room A"></div>
            <div class="field-row">
              <div class="field"><label for="ev-start">Start</label><input type="datetime-local" id="ev-start"></div>
              <div class="field"><label for="ev-end">End</label><input type="datetime-local" id="ev-end"></div>
            </div>
            <div class="field"><label for="ev-desc">Description</label><textarea id="ev-desc" placeholder="Event details..."></textarea></div>
          </div>
        </div>
      </div>

      <div class="panel open" id="panel-dots">
        <button type="button" class="panel-header" aria-expanded="true" aria-controls="panel-dots-body" data-action="action-2">
          <span class="panel-header-left"><span class="panel-icon"><i class="fas fa-circle"></i></span> Dot Style</span>
          <i class="fas fa-chevron-down chevron"></i>
        </button>
        <div class="panel-body" id="panel-dots-body">
          <div class="section-label">Data Dots</div>
          <div class="dot-grid" id="dot-grid"></div>
          <div class="divider"></div>
          <div class="section-label">Corner Squares</div>
          <div class="corner-grid" id="corner-sq-grid"></div>
          <div class="divider"></div>
          <div class="section-label">Corner Dots</div>
          <div class="corner-grid" id="corner-dot-grid"></div>
        </div>
      </div>

      <div class="panel open" id="panel-color">
        <button type="button" class="panel-header" aria-expanded="true" aria-controls="panel-color-body" data-action="action-3">
          <span class="panel-header-left"><span class="panel-icon"><i class="fas fa-palette"></i></span> Colors &amp; Gradient</span>
          <i class="fas fa-chevron-down chevron"></i>
        </button>
        <div class="panel-body" id="panel-color-body">
          <div class="section-label">Quick Gradient Presets</div>
          <div class="gradient-presets" id="grad-presets"></div>
          <div class="divider"></div>
          <div class="toggle-row">
            <label>Use Gradient</label>
            <label class="toggle"><input type="checkbox" id="use-gradient" aria-label="Use gradient" checked=""><span class="toggle-slider"></span></label>
          </div>
          <div id="gradient-controls">
            <div class="field"><label for="gradient-type">Gradient Style</label>
              <select id="gradient-type">
                <option value="linear">Linear</option>
                <option value="radial">Radial</option>
              </select>
            </div>
            <div class="field"><label for="gradient-dir">Direction</label>
              <select id="gradient-dir">
                <option value="0">→ Left to Right</option>
                <option value="1.5708">↓ Top to Bottom</option>
                <option value="0.7854">↘ Diagonal ↘</option>
                <option value="2.3562">↙ Diagonal ↙</option>
                <option value="3.14159">← Right to Left</option>
                <option value="4.7124">↑ Bottom to Top</option>
                <option value="5.4978">↗ Diagonal ↗</option>
                <option value="custom">Custom Angle</option>
              </select>
            </div>
            <div class="field" id="custom-angle-field" style="display:none">
              <label for="gradient-angle">Angle (0 – 6.28 rad)</label>
              <input type="number" id="gradient-angle" step="0.05" value="0" min="0" max="6.28">
            </div>
            <div class="field-row">
              <div class="field"><label for="color-from">Color 1</label><input type="color" id="color-from" value="#000000"></div>
              <div class="field"><label for="color-to">Color 2</label><input type="color" id="color-to" value="#45a049"></div>
            </div>
            <div class="toggle-row">
              <label>3-Stop Gradient</label>
              <label class="toggle"><input type="checkbox" id="three-stop" aria-label="Three-stop gradient"><span class="toggle-slider"></span></label>
            </div>
            <div class="field" id="stop3-wrap" style="display:none">
              <label for="color-mid">Color 3 (midpoint)</label>
              <input type="color" id="color-mid" value="#1a7aff">
            </div>
          </div>
          <div id="solid-controls" style="display:none">
            <div class="field"><label for="solid-color">Dot Color</label><input type="color" id="solid-color" value="#000000"></div>
          </div>
          <div class="divider"></div>
          <div class="gradient-preview" id="gradient-preview" style="margin-top:0.2rem"></div>
          <div class="divider"></div>
          <div class="toggle-row">
            <label>Custom Corner Color</label>
            <label class="toggle"><input type="checkbox" id="custom-corner-color" aria-label="Custom corner color"><span class="toggle-slider"></span></label>
          </div>
          <div id="corner-color-controls" style="display:none">
            <div class="field-row">
              <div class="field"><label for="corner-from">Corner From</label><input type="color" id="corner-from" value="#000000"></div>
              <div class="field"><label for="corner-to">Corner To</label><input type="color" id="corner-to" value="#45a049"></div>
            </div>
          </div>
          <div class="divider"></div>
          <div class="field"><label for="bg-color">Background Color</label><input type="color" id="bg-color" value="#ffffff"></div>
          <div class="toggle-row">
            <label>Transparent Background</label>
            <label class="toggle"><input type="checkbox" id="transparent-bg" aria-label="Transparent background"><span class="toggle-slider"></span></label>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-size">
        <button type="button" class="panel-header" aria-expanded="false" aria-controls="panel-size-body" data-action="action-4">
          <span class="panel-header-left"><span class="panel-icon"><i class="fas fa-expand-arrows-alt"></i></span> Size &amp; Margin</span>
          <i class="fas fa-chevron-down chevron"></i>
        </button>
        <div class="panel-body" id="panel-size-body">
          <div class="field"><label for="size-preset">Size Preset</label>
            <select id="size-preset">
              <option value="200">Tiny (200px)</option>
              <option value="300" selected="">Standard (300px)</option>
              <option value="400">Medium (400px)</option>
              <option value="600">Large (600px)</option>
              <option value="1000">Print (1000px)</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="field" id="custom-size-field" style="display:none">
            <label for="qr-size">Custom Size (px)</label>
            <input type="number" id="qr-size" value="300" min="50" max="2000">
          </div>
          <div class="field">
            <label for="qr-margin">Quiet Zone (Margin)</label>
            <div class="range-row">
              <input type="range" id="qr-margin" min="0" max="80" step="4" value="0">
              <span class="range-val" id="margin-val">0px</span>
            </div>
          </div>
          <div class="field"><label for="error-level">Error Correction</label>
            <select id="error-level">
              <option value="L">L — 7% (Max capacity)</option>
              <option value="M" selected="">M — 15% (Balanced)</option>
              <option value="Q">Q — 25% (Recommended for logos)</option>
              <option value="H">H — 30% (Max resilience)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-logo">
        <button type="button" class="panel-header" aria-expanded="false" aria-controls="panel-logo-body" data-action="action-5">
          <span class="panel-header-left"><span class="panel-icon"><i class="fas fa-image"></i></span> Logo Overlay</span>
          <i class="fas fa-chevron-down chevron"></i>
        </button>
        <div class="panel-body" id="panel-logo-body">
          <div class="field"><label for="logo">Upload Logo</label><input type="file" id="logo" accept="image/*"></div>
          <div class="field">
            <label for="logo-size">Logo Size</label>
            <div class="range-row">
              <input type="range" id="logo-size" min="5" max="50" value="20">
              <span class="range-val" id="logo-size-val">20%</span>
            </div>
          </div>
          <div class="field">
            <label for="logo-margin">Logo Margin</label>
            <div class="range-row">
              <input type="range" id="logo-margin" min="0" max="30" value="5">
              <span class="range-val" id="logo-margin-val">5px</span>
            </div>
          </div>
          <div class="toggle-row">
            <label>Hide Dots Behind Logo</label>
            <label class="toggle"><input type="checkbox" id="logo-hide-bg" aria-label="Hide dots behind logo" checked=""><span class="toggle-slider"></span></label>
          </div>
          <button class="btn btn-danger" id="remove-logo" type="button"><i class="fas fa-trash"></i> Remove Logo</button>
        </div>
      </div>

      <div class="panel" id="panel-export">
        <button type="button" class="panel-header" aria-expanded="false" aria-controls="panel-export-body" data-action="action-6">
          <span class="panel-header-left"><span class="panel-icon"><i class="fas fa-download"></i></span> Export</span>
          <i class="fas fa-chevron-down chevron"></i>
        </button>
        <div class="panel-body" id="panel-export-body">
          <div class="field"><label for="file-name">File Name</label><input type="text" id="file-name" placeholder="my-qr-code"></div>
          <div class="field-row">
            <div class="field"><label for="export-format">Format</label>
              <select id="export-format">
                <option value="png">PNG</option>
                <option value="svg">SVG</option>
                <option value="webp">WebP</option>
                <option value="jpeg">JPEG</option>
              </select>
            </div>
            <div class="field"><label for="export-quality">Quality %</label><input type="number" id="export-quality" value="95" min="1" max="100"></div>
          </div>
          <button class="btn btn-primary" id="download" type="button"><i class="fas fa-download"></i> Download QR Code</button>
        </div>
      </div>

    </div>

    <div class="preview-area">
      <div class="preview-label"><i class="fas fa-eye"></i> &nbsp;Live Preview</div>
      <div class="qr-wrap"><div id="qr-code"></div></div>
      <div class="info-chip">Size: <span id="info-size">300</span>px &nbsp;|&nbsp; EC: <span id="info-ec">M</span> &nbsp;|&nbsp; Style: <span id="info-dot">square</span></div>
      <div class="preview-actions">
        <button class="btn btn-primary" id="dl-btn" type="button"><i class="fas fa-download"></i> Download</button>
        <button class="btn btn-danger" id="reset-btn" type="button"><i class="fas fa-redo"></i> Reset All</button>
      </div>
    </div>
  </div>
</div>

<script src="/vendor/jquery-3.7.1.min.js"></script>
<script src="/js/pages/templates-generators-qr-code-beta-1.js"></script>
<button class="back-button" type="button" data-history-back>← Back</button>


<script src="/js/pages/templates-generators-qr-code-beta-events.js"></script><script src="/js/back-navigation.js"></script></body></html>
