<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UUID Generator</title>
    <meta name="theme-color" content="#121212" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/images/MultiTools.jpg" />

  <link rel="stylesheet" href="../../css/index.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <link rel="stylesheet" href="../../css/footer.css" />
</head>
<body class="tool-page">


<div class="title">
    <h1>UUID Generator</h1>
    <h2>Generate unique UUID's</h2>
</div>

<div class="container">
    <input type="text" id="uuidInput" placeholder="Generated UUID will appear here" readonly aria-label="Generated UUID" />
    <button id="generateButton" onclick="generateUUID()">Generate UUID</button>




<script>
    function generateUUID() {
        const template = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx";
        const uuid = template.replace(/[xy]/g, char => {
            const rand = crypto.getRandomValues(new Uint8Array(1))[0] & 15;
            const val = char === "x" ? rand : (rand & 0x3 | 0x8); // RFC 4122 variant
            return val.toString(16);
        });

        const uuidInput = document.getElementById("uuidInput");
        if (uuidInput) {
            uuidInput.value = uuid;
        }
    }
</script>


<button class="back-button" type="button" onclick="window.history.back()">&#8592; Back</button>
</body>
</html>
