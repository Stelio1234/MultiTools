<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No as a Service</title>
  <link rel="icon" type="image/x-icon" href="/images/MultiTools.jpg" />
  <meta name="theme-color" content="#121212" />

  <link rel="stylesheet" href="../../css/index.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <link rel="stylesheet" href="../../css/footer.css" />
</head>
<body class="tool-page reason-page">


  <div class="container">
    <h1>No as a Service</h1>
    <div id="output">No</div>
    <button class="btn" id="fetchBtn">New Reason</button>
    <ul>
        <p>This tool is powerd by No-as-a-Service.</p>
        <p>Click <a href="https://github.com/hotheadhacker/no-as-a-service">Here</a> to visit the project</p>
    </ul>
  </div>

  <script>
    const button = document.getElementById('fetchBtn');
    const outputDiv = document.getElementById('output');

    button.addEventListener('click', async () => {
      outputDiv.textContent = "Loading...";
      try {
        const response = await fetch('https://naas.isalman.dev/no');
        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json(); // JSON response
        if (!data.reason) throw new Error('No reason found in response');

        outputDiv.textContent = data.reason; // ONLY show the reason
      } catch (error) {
        outputDiv.textContent = 'Error: ' + error.message;
      }
    });
  </script>

<button class="back-button" type="button" onclick="window.history.back()">&#8592; Back</button>
</body>
</html>
