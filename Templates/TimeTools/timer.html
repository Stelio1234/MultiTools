<body class="tool-page timer-page">

  <div class="container">
    <h1>Timer</h1>
    <div class="circle-wrapper" id="circleWrapper">
      <svg>
        <circle class="circle-bg" cx="110" cy="110" r="100"></circle>
        <circle class="circle-progress" cx="110" cy="110" r="100"></circle>
      </svg>
      <div class="circle-text" id="circleDisplay">00:00:00</div>
    </div>
    <div class="timer-inputs" id="inputsWrapper">
      <input type="number" id="hours" class="form-control" placeholder="Hours" min="0" max="23" aria-label="Hours">
      <input type="number" id="minutes" class="form-control" placeholder="Minutes" min="0" max="59" aria-label="Minutes">
      <input type="number" id="seconds" class="form-control" placeholder="Seconds" min="0" max="59" aria-label="Seconds">
    </div>
    <div class="button-group">
      <button class="btn" id="startBtn" type="button">Start</button>
      <button class="btn btn-secondary" id="stopBtn" type="button">Stop</button>
      <div id="notificationRequestContainer" class="mt-3"></div>
    </div>
  </div>


  <script src="/js/pages/templates-timetools-timer-1.js"></script>
<button class="back-button" type="button" data-history-back>← Back</button>
