<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://multitools.statuspage.io https://naas.isalman.dev; frame-src https://multitools-48cc8.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <meta name="theme-color" content="#121212">

  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="../../css/index.css">
  <link rel="stylesheet" href="../../css/pages.css">
  <link rel="stylesheet" href="../../css/footer.css">
  <script src="../../js/unit-converter.js" defer=""></script>

<meta name="description" content="Unit Converter from MultiTools. Use this free online page in your browser.">
<link rel="canonical" href="https://www.themultitools.xyz/Templates/CommonTools/UnitConverter.html">
<link rel="icon" href="/images/MultiTools.jpg" type="image/jpeg">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="stylesheet" href="/css/consent.css"><script src="/js/site-consent.js"></script></head>
<body class="tool-page converter-page">
  <main class="container">
    <div class="title"><h1>Unit Converter</h1></div>
    <label class="sr-only" for="conversion-category">Conversion category</label>
    <select id="conversion-category"></select>
    <div class="converter-equation">
      <div class="converter-unit">
        <label class="sr-only" for="conversion-value">Amount to convert</label>
        <input id="conversion-value" type="number" step="any" value="1" inputmode="decimal" aria-describedby="conversion-error">
        <label class="sr-only" for="conversion-from">From unit</label>
        <select id="conversion-from"></select>
      </div>
      <span class="converter-equals" aria-hidden="true">=</span>
      <div class="converter-unit">
        <output id="conversion-result" for="conversion-value conversion-from conversion-to" aria-label="Converted amount" aria-live="polite">—</output>
        <label class="sr-only" for="conversion-to">To unit</label>
        <select id="conversion-to"></select>
      </div>
    </div>
    <p id="conversion-error" class="error-message" role="alert"></p>
    <p class="converter-formula"><span id="conversion-formula"></span></p>
    <div class="button-group">
      <button id="conversion-swap" class="btn-secondary" type="button">⇆ Swap units</button>
      <button id="conversion-copy" class="copy-button" type="button">Copy result</button>
    </div>
    <p id="conversion-copy-status" class="muted" role="status"></p>
    <p id="conversion-note" class="muted"></p>
    <noscript><p>Enable JavaScript to use the converter.</p></noscript>
  </main>
  <button class="back-button" type="button" data-history-back>← Back</button>


<script src="/js/back-navigation.js"></script></body></html>
