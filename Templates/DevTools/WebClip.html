<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com https://multitools.statuspage.io https://naas.isalman.dev; frame-src https://multitools-48cc8.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Web Clip Generator</title>
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="/manifest.json">


  <link rel="stylesheet" href="../../css/index.css">
  <link rel="stylesheet" href="../../css/pages.css">
  <link rel="stylesheet" href="../../css/footer.css">

<meta name="description" content="Create an iOS Web Clip configuration profile with your HTTPS website URL, icon, display name, and options.">
<link rel="canonical" href="https://www.themultitools.xyz/Templates/DevTools/WebClip.html">
<link rel="icon" href="/images/MultiTools.jpg" type="image/jpeg">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="stylesheet" href="/css/consent.css"><script src="/js/site-consent.js"></script></head>
<body class="tool-page webclip-page">


<div class="container">
    <div class="title">
        <h1>WebClip Generator</h1>
    </div>
    <!-- Payload Display Name -->
    <input id="displayNameInput" type="text" placeholder="Enter Display Name..." aria-label="Enter Display Name...">

    <!-- Link for Web Clip -->
    <input id="linkInput" type="url" placeholder="Enter URL..." aria-label="Enter URL...">

    <!-- Payload Description -->
    <textarea id="descriptionInput" placeholder="Enter Description..." rows="3" aria-label="Enter Description..."></textarea>

    <!-- Payload Version -->
    <input id="versionInput" type="number" placeholder="Enter Version Number..." value="1" aria-label="Enter Version Number...">

    <!-- Icon upload -->
    <input type="file" id="iconInput" accept="image/*" aria-label="Web Clip icon">
    <div id="preview-container">
        <img id="preview" alt="Icon Preview" src="/images/MultiTools.jpg">
        <span class="delete-icon" data-action="action-1">×</span>
    </div>

    <!-- Removal Passcode -->
    <input id="removalPasscode" type="text" placeholder="Enter Removal Passcode (Optional)" aria-label="Enter Removal Passcode (Optional)">

    <!-- Removal Date -->
    <div class="checkbox-container">
        <input type="checkbox" id="removalDateCheckbox" data-action="action-2">
        <label for="removalDateCheckbox">Include Removal Date</label>
    </div>

    <div class="checkbox-container">
      <input type="checkbox" id="fullscreenCheckbox">
      <label for="fullscreenCheckbox">Launch in Full Screen</label>
    </div>

    <!-- Removal Date (Visible if checkbox is true) -->
    <input id="removalDateInput" type="date" placeholder="Enter Removal Date..." style="display:none;" aria-label="Enter Removal Date...">

    <button type="button" data-action="action-3">Generate Web Clip</button>

    <!-- Progress Bar -->
    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
    </div>

    <!-- Download button -->

    <!-- Error message -->
    <div id="errorMessage" class="error-message"></div>
</div>

<!-- Back Button -->


<script src="/js/pages/templates-devtools-webclip-1.js"></script>




<button class="back-button" type="button" data-history-back>← Back</button>


<script src="/js/pages/templates-devtools-webclip-events.js"></script><script src="/js/back-navigation.js"></script></body></html>
