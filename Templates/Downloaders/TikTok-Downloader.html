<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Downloader</title>
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/images/MultiTools.jpg">

  <link rel="stylesheet" href="../../css/index.css" />
  <link rel="stylesheet" href="../../css/pages.css" />
  <link rel="stylesheet" href="../../css/footer.css" />
</head>
<body class="tool-page">

<div class="container">
    <div class="title">
        <h1>TikTok Downloader</h1>
    </div>
    <input id="urlInput" type="text" placeholder="Enter TikTok link..." aria-label="Enter TikTok link..." />
    <button onclick="downloadVideo()">Download</button>

    <!-- Loading spinner -->
    <div id="loadingSpinner" class="loading-spinner"></div>

    <!-- Error message -->
    <div id="errorMessage" class="error-message"></div>
</div>



<script>
    async function downloadVideo() {
        const url = document.getElementById('urlInput').value;
        const spinner = document.getElementById('loadingSpinner');
        const errorMessage = document.getElementById('errorMessage');

        // Reset previous errors
        errorMessage.textContent = '';
        if (!url) {
            errorMessage.textContent = 'Please enter a valid URL.';
            return;
        }

        // Show loading spinner
        spinner.style.display = 'block';

        try {
            const response = await fetch(`http://192.168.1.43:5000/download?tiktok_url=${encodeURIComponent(url)}`);

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Failed to download');
            }

            const blob = await response.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'tiktok_video.mp4';
            link.click();

            alert('Download started successfully!');
        } catch (error) {
            errorMessage.textContent = error.message;
        } finally {
            // Hide loading spinner
            spinner.style.display = 'none';
        }
    }
</script>
<button class="back-button" type="button" onclick="window.history.back()">&#8592; Back</button>
</body>
</html>
